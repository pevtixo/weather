<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Weather | Decision Engine</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Links -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Extreme Weather</h1>
            <p>Your Personal Decision Engine</p>
        </header>

        <main class="dashboard-grid">
            <!-- Profile Card -->
            <section class="glass-card profile-card">
                <h2>👤 My Personal Profile</h2>
                <p class="subtitle">Let the AI know you better for personalized advice.</p>
                
                <div class="form-group">
                    <label for="health">Health Conditions:</label>
                    <select id="health">
                        <option value="none">None</option>
                        <option value="asthma" selected>Asthma / Breathing issues</option>
                        <option value="allergies">Allergies</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="commute">Daily Commute:</label>
                    <select id="commute">
                        <option value="walk" selected>I walk</option>
                        <option value="cycle">I cycle</option>
                        <option value="car">I drive</option>
                    </select>
                </div>

                <button id="save-profile-btn" class="btn btn-primary">Save Profile</button>
            </section>

            <!-- Weather & Decision Card -->
            <section class="glass-card weather-card">
                <div class="search-box">
                    <input type="text" id="city-input" placeholder="Enter city...">
                    <button id="search-btn" class="btn btn-icon">🔍 Go</button>
                </div>

                <div id="weather-result" class="weather-result hidden">
                    <!-- Data will be injected by JS -->
                    <div class="weather-header">
                        <h3 id="city-name">City</h3>
                        <span id="weather-temp" class="temp">--°C</span>
                    </div>
                    <p id="weather-desc">Condition</p>
                    
                    <div id="decision-box" class="decision-box safe">
                        <h4>AI Decision:</h4>
                        <p id="decision-text">Loading recommendation...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/api.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
